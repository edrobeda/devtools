server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy pro container da API (devtools-api) — resolver do Docker (127.0.0.11)
    # + variável no proxy_pass pra resolução de DNS ficar dinâmica (não trava
    # o nginx na subida se o container da API ainda não estiver pronto).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://DK_DEVTOOLS_API:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — todas as rotas servem index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
